name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Dependencies (wxWidgets, llama.cpp, curl, ...) are fetched and built by CMake and are slow to build.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify DLL imports
        run: cmake --build build --config Release --target verify_imports

      - name: Stage executables for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item build/Release/llm-gateway.exe bin/ -Force
          Copy-Item build/Release/MaintenanceTool.exe bin/ -Force

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Gateway-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
